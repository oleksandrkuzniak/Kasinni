<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Асистент Продавця & Сканер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Блідо-оранжевий / червонуватий приємний фон */
        body {
            background: linear-gradient(135deg, #fdf3f0 0%, #faece8 100%);
            background-attachment: fixed;
            color: #1a1a1a;
            padding: 14px 12px;
            max-width: 680px;
            margin: 0 auto;
            padding-bottom: 220px;
            min-height: 100vh;
        }

        /* Шапка у вигляді окремої плашки */
        .header {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(220, 80, 50, 0.08);
            border: 1px solid rgba(229, 115, 115, 0.25);
        }

        /* Виділений жирний заголовок */
        .header h1 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #2c1810;
            letter-spacing: -0.2px;
        }

        /* Квадратна кнопка налаштувань */
        .btn-settings {
            width: 42px;
            height: 42px;
            background-color: #fff4f2;
            border: 1px solid #f87171;
            border-radius: 12px;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .btn-settings:active {
            transform: scale(0.93);
            background-color: #fca5a5;
        }

        /* Центральний виділений блок чату */
        .main-chat-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 25px rgba(210, 70, 40, 0.07);
            border: 1px solid rgba(229, 115, 115, 0.2);
            min-height: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            padding: 12px 15px;
            border-radius: 15px;
            font-size: 0.93rem;
            line-height: 1.5;
            white-space: pre-wrap;
            max-width: 90%;
            word-break: break-word;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #e14d3d 0%, #c83727 100%);
            color: white;
            font-weight: 500;
            border-bottom-right-radius: 3px;
            box-shadow: 0 3px 8px rgba(225, 77, 61, 0.25);
        }

        .chat-bubble.assistant {
            align-self: flex-start;
            background-color: #fff9f8;
            color: #271c19;
            border: 1px solid rgba(239, 154, 154, 0.3);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border-bottom-left-radius: 3px;
            width: 100%;
        }

        /* Модальне вікно налаштувань */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 20, 15, 0.45);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 1px solid rgba(239, 154, 154, 0.4);
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #fce8e6;
            padding-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #2c1810;
        }

        .btn-close-modal {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #888;
            padding: 4px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 700; /* Жирний шрифт підписів */
            color: #3d241c;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #fca5a5;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #fffdfd;
            outline: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: #e14d3d;
            box-shadow: 0 0 0 3px rgba(225, 77, 61, 0.15);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .btn-save-key {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .status-tag {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .status-tag.active { color: #059669; }
        .status-tag.inactive { color: #dc2626; }

        .btn-danger {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            padding: 11px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Зафіксована панель внизу */
        .bottom-control-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 12px 14px 18px 14px;
            box-shadow: 0 -6px 25px rgba(210, 70, 40, 0.1);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            border: 1px solid rgba(229, 115, 115, 0.25);
            border-bottom: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .bottom-control-panel.minimized {
            transform: translateX(-50%) translateY(35px);
            opacity: 0.88;
        }

        .search-box-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 11px;
            border: 1px solid #fca5a5;
            border-radius: 12px;
            font-size: 0.92rem;
            resize: none;
            outline: none;
            background-color: #fffdfd;
        }

        textarea:focus {
            border-color: #e14d3d;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(225, 77, 61, 0.15);
        }

        .preview-wrapper {
            position: relative;
            display: inline-block;
            max-width: 70px;
        }

        .preview-wrapper img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #e14d3d;
        }

        .remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-attach {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff4f2;
            border: 1px solid #f87171;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.25rem;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .btn-attach input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-send {
            flex-grow: 1;
            height: 48px;
            background: linear-gradient(135deg, #e14d3d 0%, #c83727 100%);
            color: white;
            font-size: 0.98rem;
            font-weight: 800; /* Жирний текст на кнопці */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(225, 77, 61, 0.25);
        }

        .btn-send:disabled {
            background: #fca5a5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .loading-status {
            text-align: center;
            padding: 10px;
            font-weight: 700;
            color: #e14d3d;
            font-size: 0.88rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Виділена шапка (плашка) -->
    <div class="header">
        <h1 id="appTitle">🔍 Асистент & Сканер</h1>
        <button class="btn-settings" onclick="openSettings()" title="Налаштування">⚙️</button>
    </div>

    <!-- Виділена центральна частина для чату -->
    <div class="main-chat-container" id="chatContainer"></div>

    <div id="loading" class="loading-status">
        🌐 Опрацьовую запит... Зачекайте.
    </div>

    <!-- Модальне вікно налаштувань -->
    <div class="modal-overlay" id="settingsModal" onclick="closeSettingsOnOverlay(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="settingsHeading">⚙️ Налаштування</h2>
                <button class="btn-close-modal" onclick="closeSettings()">✕</button>
            </div>

            <!-- Мова -->
            <div class="setting-item">
                <label for="langSelect" id="langLabel">🌐 Мова інтерфейсу:</label>
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="ua">Українська 🇺🇦</option>
                    <option value="en">English 🇬🇧</option>
                </select>
            </div>

            <!-- API Ключ -->
            <div class="setting-item">
                <label for="apiKey" id="keyLabel">🔑 API Ключ Google Gemini:</label>
                <div class="input-row">
                    <input type="text" id="apiKey" placeholder="Введіть ваш Gemini API Key...">
                    <button type="button" class="btn-save-key" id="btnSaveKey" onclick="saveKey()">💾 Зберегти</button>
                </div>
                <div id="keyStatusText" class="status-tag inactive">🔴 Ключ не збережено</div>
            </div>

            <!-- Історія чату -->
            <div class="setting-item">
                <label id="historyLabel">📜 Управління чатом:</label>
                <button class="btn-danger" id="btnClearChat" onclick="clearChatHistory()">🧹 Очистити історію чату</button>
            </div>
        </div>
    </div>

    <!-- Нижня фіксована панель -->
    <div class="bottom-control-panel" id="bottomPanel">
        <div class="search-box-wrapper">
            <div id="previewContainer" style="display: none;">
                <div class="preview-wrapper">
                    <img id="previewImg" src="" alt="Фото">
                    <button class="remove-btn" onclick="removeImage()">✕</button>
                </div>
            </div>

            <textarea id="promptInput" placeholder="Введіть запит або додайте фото цінника..."></textarea>

            <div class="action-bar">
                <div class="btn-attach" title="Прикріпити фото">
                    📷
                    <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
                </div>
                <button id="sendBtn" class="btn-send" onclick="sendQuery()">
                    🚀 Надіслати
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedBase64Image = "";
        let chatHistory = [];
        let currentLang = "ua";
        let lastScrollTop = 0;

        const i18n = {
            ua: {
                appTitle: "🔍 Асистент & Сканер",
                settingsHeading: "⚙️ Налаштування",
                langLabel: "🌐 Мова інтерфейсу:",
                keyLabel: "🔑 API Ключ Google Gemini:",
                keyPlaceholder: "Введіть ваш Gemini API Key...",
                saveBtn: "💾 Зберегти",
                keyActive: "🟢 Ключ GEMINI активний",
                keyInactive: "🔴 Введіть API Key",
                historyLabel: "📜 Управління чатом:",
                clearChat: "🧹 Очистити історію чату",
                promptPlaceholder: "Введіть запит або додайте фото цінника...",
                sendBtn: "🚀 Надіслати",
                loadingText: "🌐 Опрацьовую запит... Зачекайте.",
                confirmClear: "Очистити історію чату?",
                keySaved: "API Ключ успішно збережено!",
                enterKeyAlert: "Введіть API Key!",
                noKeyAlert: "Будь ласка, введіть та збережіть Gemini API Key у налаштуваннях (кнопка ⚙️)!",
                noInputAlert: "Введіть текст або додайте зображення!",
                defaultImagePrompt: "Проаналізуй зображення цінника/товару."
            },
            en: {
                appTitle: "🔍 Assistant & Scanner",
                settingsHeading: "⚙️ Settings",
                langLabel: "🌐 Interface Language:",
                keyLabel: "🔑 Google Gemini API Key:",
                keyPlaceholder: "Enter your Gemini API Key...",
                saveBtn: "💾 Save",
                keyActive: "🟢 GEMINI Key Active",
                keyInactive: "🔴 Enter API Key",
                historyLabel: "📜 Chat Management:",
                clearChat: "🧹 Clear Chat History",
                promptPlaceholder: "Enter request or attach price tag photo...",
                sendBtn: "🚀 Send",
                loadingText: "🌐 Processing request... Please wait.",
                confirmClear: "Clear chat history?",
                keySaved: "API Key saved successfully!",
                enterKeyAlert: "Enter API Key!",
                noKeyAlert: "Please enter and save Gemini API Key in Settings (⚙️ button)!",
                noInputAlert: "Enter text or attach an image!",
                defaultImagePrompt: "Analyze the price tag or product image."
            }
        };

        const SYSTEM_PROMPTS = {
            ua: `Ти — винятково професійний продавець-консультант побутової техніки та електроніки.

ПРАВИЛА ВІДПОВІДІ:
- НІКОЛИ не вигадуй характеристики чи ціни. Без вступних привітань.
- Шаблон аналізу товару при первинному запиті:

📌 Товар: [Точна назва та модель]
🏷 Ціна на ціннику / середня ціна: [Ціна] грн

📋 ХАРАКТЕРИСТИКИ:
- Категорія: [Тип пристрою]
- Процесор / Чіпсет: [Модель]
- Оперативна пам'ять: [Об'єм]
- Накопичувач: [Об'єм]
- Екран: [Діагональ, матриця]
- Зарядка / Акумулятор: [Ємність, потужність]
- Ключові особливості: [Основні фішки]

💡 КОРОТКИЙ ВЕРДИКТ КОНСУЛЬТАНТА:
[Професійна оцінка покупцю]`,

            en: `You are an exceptionally professional retail consultant for consumer electronics and home appliances.

RESPONSE RULES:
- NEVER invent specs or prices. No introductory greetings.
- Product analysis template:

📌 Product: [Exact Name and Model]
🏷 Price on tag / average price: [Price]

📋 SPECIFICATIONS:
- Category: [Device Type]
- Processor / Chipset: [Model]
- RAM: [Capacity]
- Storage: [Capacity]
- Display: [Diagonal, panel type]
- Charging / Battery: [Capacity, wattage]
- Key Features: [Main highlights]

💡 CONSULTANT'S VERDICT:
[Professional assessment for customer]`
        };

        document.addEventListener("DOMContentLoaded", () => {
            currentLang = localStorage.getItem("gemini_app_lang") || "ua";
            document.getElementById("langSelect").value = currentLang;
            applyTranslations(currentLang);

            loadKey();

            const savedChat = localStorage.getItem("gemini_chat_history");
            if (savedChat) {
                try {
                    chatHistory = JSON.parse(savedChat);
                    renderChat();
                } catch(e) { chatHistory = []; }
            }
        });

        // Плавний прихований скрол панелі
        window.addEventListener("scroll", () => {
            const st = window.pageYOffset || document.documentElement.scrollTop;
            const panel = document.getElementById("bottomPanel");
            if (st > lastScrollTop && st > 80) {
                panel.classList.add("minimized");
            } else {
                panel.classList.remove("minimized");
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });

        // Модальне вікно
        function openSettings() {
            document.getElementById("settingsModal").classList.add("active");
        }

        function closeSettings() {
            document.getElementById("settingsModal").classList.remove("active");
        }

        function closeSettingsOnOverlay(e) {
            if (e.target.id === "settingsModal") {
                closeSettings();
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("gemini_app_lang", lang);
            applyTranslations(lang);
            const key = document.getElementById("apiKey").value.trim();
            updateKeyStatus(key);
        }

        function applyTranslations(lang) {
            const t = i18n[lang];
            document.getElementById("appTitle").textContent = t.appTitle;
            document.getElementById("settingsHeading").textContent = t.settingsHeading;
            document.getElementById("langLabel").textContent = t.langLabel;
            document.getElementById("keyLabel").textContent = t.keyLabel;
            document.getElementById("apiKey").placeholder = t.keyPlaceholder;
            document.getElementById("btnSaveKey").textContent = t.saveBtn;
            document.getElementById("historyLabel").textContent = t.historyLabel;
            document.getElementById("btnClearChat").textContent = t.clearChat;
            document.getElementById("promptInput").placeholder = t.promptPlaceholder;
            document.getElementById("sendBtn").textContent = t.sendBtn;
            document.getElementById("loading").textContent = t.loadingText;
        }

        function loadKey() {
            const savedKey = localStorage.getItem("gemini_api_key") || "";
            document.getElementById("apiKey").value = savedKey;
            updateKeyStatus(savedKey);
        }

        function saveKey() {
            const key = document.getElementById("apiKey").value.trim();
            const t = i18n[currentLang];
            if (!key) {
                alert(t.enterKeyAlert);
                return;
            }
            localStorage.setItem("gemini_api_key", key);
            updateKeyStatus(key);
            alert(t.keySaved);
        }

        function updateKeyStatus(key) {
            const statusEl = document.getElementById("keyStatusText");
            const t = i18n[currentLang];
            if (key.trim().length > 0) {
                statusEl.className = "status-tag active";
                statusEl.textContent = t.keyActive;
            } else {
                statusEl.className = "status-tag inactive";
                statusEl.textContent = t.keyInactive;
            }
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64Image = e.target.result.split(',')[1];
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedBase64Image = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('previewContainer').style.display = 'none';
        }

        function clearChatHistory() {
            const t = i18n[currentLang];
            if (confirm(t.confirmClear)) {
                chatHistory = [];
                localStorage.removeItem("gemini_chat_history");
                renderChat();
                closeSettings();
            }
        }

        function renderChat() {
            const container = document.getElementById("chatContainer");
            container.innerHTML = "";

            chatHistory.forEach(msg => {
                const bubble = document.createElement("div");
                bubble.className = `chat-bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
                bubble.textContent = msg.text;
                container.appendChild(bubble);
            });

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function sendQuery() {
            const t = i18n[currentLang];
            let apiKey = document.getElementById("apiKey").value.trim() || localStorage.getItem("gemini_api_key");

            if (!apiKey) {
                alert(t.noKeyAlert);
                openSettings();
                return;
            }

            const textQuery = document.getElementById("promptInput").value.trim();
            if (!textQuery && !selectedBase64Image) {
                alert(t.noInputAlert);
                return;
            }

            const loadingEl = document.getElementById("loading");
            const sendBtn = document.getElementById("sendBtn");

            loadingEl.style.display = "block";
            sendBtn.disabled = true;

            const userText = textQuery || t.defaultImagePrompt;
            chatHistory.push({ role: "user", text: userText });
            renderChat();

            document.getElementById("promptInput").value = "";
            const currentImg = selectedBase64Image;
            removeImage();

            try {
                const responseText = await callGeminiAPI(apiKey, userText, currentImg);
                chatHistory.push({ role: "assistant", text: responseText });
                localStorage.setItem("gemini_chat_history", JSON.stringify(chatHistory));
                renderChat();
            } catch (err) {
                chatHistory.push({ role: "assistant", text: "❌ API Error: " + err.message });
                renderChat();
            }

            loadingEl.style.display = "none";
            sendBtn.disabled = false;
        }

        // Gemini 3.6 Flash API із системою автоповтору
        async function callGeminiAPI(apiKey, text, imgBase64, retries = 2) {
            const contents = chatHistory.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            }));

            if (imgBase64) {
                contents[contents.length - 1].parts.push({
                    inline_data: { mime_type: "image/jpeg", data: imgBase64 }
                });
            }

            const systemPrompt = SYSTEM_PROMPTS[currentLang] || SYSTEM_PROMPTS.ua;
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: systemPrompt }] },
                            contents: contents
                        })
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        const errMsg = data.error?.message || "Gemini API Server Error";
                        
                        if ((res.status === 503 || res.status === 429 || errMsg.includes("demand") || errMsg.includes("overloaded")) && attempt < retries) {
                            await new Promise(r => setTimeout(r, 2000));
                            continue;
                        }
                        throw new Error(errMsg);
                    }

                    return data.candidates[0].content.parts.map(p => p.text).join("");
                } catch (err) {
                    if (attempt === retries) throw err;
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }
    </script>
</body>
